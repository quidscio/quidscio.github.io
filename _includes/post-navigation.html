{% if page.previous.url or page.next.url %}
<nav class="post-navigation{% if include.position == 'top' %} post-navigation-top{% endif %}" aria-label="Post navigation">
  {% if page.previous.url %}
  <a class="previous" href="{{ page.previous.url }}">&laquo; Prev: {{ page.previous.title | truncate: 25 }}</a>
  {% endif %}

  {% if page.previous.url and page.next.url %}
  <span class="separator"> | </span>
  {% endif %}

  {% if page.next.url %}
  <a class="next" href="{{ page.next.url }}">&raquo; Next: {{ page.next.title | truncate: 25 }}</a>
  {% endif %}
</nav>
{% endif %}
